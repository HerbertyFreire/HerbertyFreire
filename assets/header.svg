<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Herberty Freire — Full Stack Developer · Maceió, Alagoas">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05121f"/>
      <stop offset="0.55" stop-color="#0a2236"/>
      <stop offset="1" stop-color="#0d3346"/>
    </linearGradient>
    <linearGradient id="sea1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="sea2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.6" stop-color="#99f6e4"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#5eead4" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="22"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
      .sans{font-family:'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif}
      .wave1{animation:drift 14s linear infinite}
      .wave2{animation:drift 9s linear infinite reverse}
      @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-600px)}}
      .pkt{animation:fly 3.2s cubic-bezier(.6,0,.4,1) infinite}
      .pkt.b{animation-delay:1.05s}.pkt.c{animation-delay:2.1s}
      @keyframes fly{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(330px);opacity:0}}
      .fade{opacity:0;animation:in .9s ease-out forwards}
      .d1{animation-delay:.15s}.d2{animation-delay:.45s}.d3{animation-delay:.75s}.d4{animation-delay:1.05s}
      @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
      .cursor{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .r1,.r2,.r3{opacity:0;animation:roll 12s infinite}
      .r2{animation-delay:4s}.r3{animation-delay:8s}
      @keyframes roll{0%{opacity:0;transform:translateY(8px)}4%,29%{opacity:1;transform:translateY(0)}33%,100%{opacity:0;transform:translateY(-8px)}}
      .glow{animation:pulse 4s ease-in-out infinite}
      @keyframes pulse{50%{opacity:.55}}
      .node{animation:pulse 2.4s ease-in-out infinite}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#sky)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle class="glow" cx="1010" cy="250" r="150" fill="url(#sun)"/>

    <!-- mar de Maceió -->
    <g class="wave1">
      <path fill="url(#sea1)" d="M0 268 C 75 252 150 252 225 268 S 375 284 450 268 S 600 252 675 268 S 825 284 900 268 S 1050 252 1125 268 S 1275 284 1350 268 S 1500 252 1575 268 S 1725 284 1800 268 V340 H0Z"/>
    </g>
    <g class="wave2">
      <path fill="url(#sea2)" d="M0 290 C 100 278 200 278 300 290 S 500 302 600 290 S 800 278 900 290 S 1100 302 1200 290 S 1400 278 1500 290 S 1700 302 1800 290 V340 H0Z"/>
    </g>

    <!-- topologia de rede: peer A → switch → peer B -->
    <g transform="translate(760 70)">
      <line x1="0" y1="60" x2="330" y2="60" stroke="#5eead4" stroke-opacity=".25" stroke-width="2" stroke-dasharray="4 6"/>
      <circle class="pkt"   cx="0" cy="60" r="5" fill="#5eead4"/>
      <circle class="pkt b" cx="0" cy="60" r="5" fill="#fbbf24"/>
      <circle class="pkt c" cx="0" cy="60" r="5" fill="#f472b6"/>
      <g class="node"><circle cx="0" cy="60" r="18" fill="#0b2a3a" stroke="#5eead4" stroke-width="2"/></g>
      <rect x="146" y="44" width="38" height="32" rx="6" fill="#0b2a3a" stroke="#fbbf24" stroke-width="2"/>
      <path d="M155 56h20M155 64h20" stroke="#fbbf24" stroke-width="2"/>
      <g class="node"><circle cx="330" cy="60" r="18" fill="#0b2a3a" stroke="#5eead4" stroke-width="2"/></g>
      <text class="mono" x="0" y="66" text-anchor="middle" font-size="12" fill="#5eead4">A</text>
      <text class="mono" x="330" y="66" text-anchor="middle" font-size="12" fill="#5eead4">B</text>
      <text class="mono" x="165" y="108" text-anchor="middle" font-size="12" fill="#94a3b8">webrtc · cut-through vs store-and-forward</text>
    </g>

    <!-- texto -->
    <g transform="translate(64 0)">
      <g class="fade d1">
        <text class="mono" x="0" y="78" font-size="16" fill="#5eead4">~/maceio-al $ whoami<tspan class="cursor">▍</tspan></text>
      </g>
      <g class="fade d2">
        <text class="sans" x="0" y="150" font-size="64" font-weight="800" fill="url(#name)" letter-spacing="-1.5">Herberty Freire</text>
      </g>
      <g class="fade d3">
        <text class="sans" x="2" y="192" font-size="22" fill="#cbd5e1">Full Stack Developer <tspan fill="#5eead4">·</tspan> Ciência da Computação @ UFAL</text>
      </g>
      <g class="fade d4" transform="translate(2 232)">
        <text class="mono" x="0" y="0" font-size="17" fill="#94a3b8">&gt;</text>
        <g transform="translate(22 0)">
          <text class="mono r1" x="0" y="0" font-size="17" fill="#f8fafc">sistemas e dados para políticas públicas em Alagoas</text>
          <text class="mono r2" x="0" y="0" font-size="17" fill="#f8fafc">pesquisando QoE de WebRTC sob estresse de rede (ns-3)</text>
          <text class="mono r3" x="0" y="0" font-size="17" fill="#f8fafc">estudando engenharia de IA: LLMs, RAG e agentes</text>
        </g>
      </g>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="21" fill="none" stroke="#5eead4" stroke-opacity=".18" stroke-width="2"/>
</svg>
