<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="TCC: WebRTC em LAN, Cut-Through vs Store-and-Forward; 630 execuções no ns-3; latência SF de 0,14–0,38 ms (controlado), 2,0–2,6 ms (congestionado) e 3,5–3,7 ms (saturação); CT reduz até 15,8% sem carga e menos de 1% sob congestionamento">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07182a"/><stop offset="1" stop-color="#0b2738"/>
    </linearGradient>
    <linearGradient id="sf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="ct" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="22"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
      .sans{font-family:'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif}
      .grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.4s cubic-bezier(.2,.8,.2,1) forwards}
      .g2{animation-delay:.25s}.g3{animation-delay:.5s}
      @keyframes grow{to{transform:scaleX(1)}}
      .fade{opacity:0;animation:in .8s ease-out forwards}
      .f1{animation-delay:.9s}.f2{animation-delay:1.1s}.f3{animation-delay:1.3s}.f4{animation-delay:1.5s}
      @keyframes in{to{opacity:1}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <text class="mono" x="56" y="54" font-size="14" fill="#5eead4" letter-spacing="2">PESQUISA · TCC</text>
    <text class="sans" x="56" y="90" font-size="28" font-weight="700" fill="#f8fafc">WebRTC sob estresse de rede</text>
    <text class="sans" x="56" y="118" font-size="16" fill="#94a3b8">Cut-Through vs Store-and-Forward numa LAN · ns-3 · 10 sementes por cenário</text>

    <!-- barras de latência -->
    <g transform="translate(56 156)">
      <text class="mono" x="0" y="0" font-size="13" fill="#94a3b8">latência SF por regime de carga · a fila domina o atraso</text>
      <text class="sans" x="0" y="32" font-size="15" font-weight="600" fill="#e2e8f0">controlado</text>
      <text class="mono" x="0" y="48" font-size="11" fill="#64748b">30–50 Mbps</text>
      <rect x="150" y="20" width="440" height="18" rx="9" fill="#ffffff" fill-opacity=".05"/>
      <rect class="grow" x="150" y="20" width="44" height="18" rx="9" fill="url(#ct)"/>
      <text class="mono fade f1" x="206" y="34" font-size="14" fill="#5eead4">0,14–0,38 ms · CT −15,8%</text>

      <text class="sans" x="0" y="80" font-size="15" font-weight="600" fill="#e2e8f0">congestionado</text>
      <text class="mono" x="0" y="96" font-size="11" fill="#64748b">70–120 Mbps</text>
      <rect x="150" y="68" width="440" height="18" rx="9" fill="#ffffff" fill-opacity=".05"/>
      <rect class="grow g2" x="150" y="68" width="309" height="18" rx="9" fill="url(#sf)"/>
      <text class="mono fade f2" x="471" y="82" font-size="14" fill="#fdba74">2,0–2,6 ms</text>

      <text class="sans" x="0" y="128" font-size="15" font-weight="600" fill="#e2e8f0">saturação</text>
      <text class="mono" x="0" y="144" font-size="11" fill="#64748b">150–200 Mbps</text>
      <rect x="150" y="116" width="440" height="18" rx="9" fill="#ffffff" fill-opacity=".05"/>
      <rect class="grow g3" x="150" y="116" width="440" height="18" rx="9" fill="url(#sf)"/>
      <text class="mono fade f3" x="602" y="130" font-size="14" fill="#fda4af">3,5–3,7 ms</text>
    </g>

    <!-- stat tiles -->
    <g transform="translate(790 56)">
      <g class="fade f1">
        <rect width="170" height="96" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#5eead4" stroke-opacity=".18"/>
        <text class="sans" x="18" y="48" font-size="34" font-weight="800" fill="#f8fafc">630</text>
        <text class="sans" x="18" y="76" font-size="13" fill="#94a3b8">execuções de 300 s</text>
      </g>
      <g class="fade f2" transform="translate(186 0)">
        <rect width="170" height="96" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#5eead4" stroke-opacity=".18"/>
        <text class="sans" x="18" y="48" font-size="30" font-weight="800" fill="#f8fafc">9×7×10</text>
        <text class="sans" x="18" y="76" font-size="11" fill="#94a3b8">codecs · cargas · sementes</text>
      </g>
      <g class="fade f3" transform="translate(0 112)">
        <rect width="170" height="96" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#5eead4" stroke-opacity=".18"/>
        <text class="sans" x="18" y="48" font-size="34" font-weight="800" fill="#5eead4">15,8%</text>
        <text class="sans" x="18" y="76" font-size="13" fill="#94a3b8">ganho do CT · 30 Mbps</text>
      </g>
      <g class="fade f4" transform="translate(186 112)">
        <rect width="170" height="96" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#fb7185" stroke-opacity=".3"/>
        <text class="sans" x="18" y="48" font-size="34" font-weight="800" fill="#fda4af">&lt;1%</text>
        <text class="sans" x="18" y="76" font-size="13" fill="#94a3b8">ganho do CT · ≥70 Mbps</text>
      </g>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="21" fill="none" stroke="#5eead4" stroke-opacity=".18" stroke-width="2"/>
</svg>
