name: Gerar cobrinha e estatísticas

on:
  schedule:
    - cron: "0 */12 * * *"   # a cada 12 horas
  workflow_dispatch:          # botão "Run workflow" na aba Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#0d9488&color_dots=#ebedf0,#99f6e4,#5eead4,#14b8a6,#0f766e
            dist/snake-dark.svg?palette=github-dark&color_snake=#fbbf24&color_dots=#0b2a3a,#115e59,#0f766e,#14b8a6,#5eead4

      - name: Gerar card de estatísticas
        run: |
          python3 .github/scripts/stats.py
          sudo mkdir -p dist && sudo cp stats-out/stats.svg dist/
        env:
          OUT_DIR: stats-out
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
